name: Release APK

# Tu dong build + tao GitHub Release kem APK moi khi push tag dang vX.Y
# Vi du:  git tag v4.68 && git push origin v4.68

on:
  push:
    tags: ["v*"]

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # App co chu dich ky bang DEBUG KEY. Phai dung DUNG debug.keystore cua may dev,
      # neu khong nguoi dung se khong cai de update duoc (khac chu ky).
      # Secret DEBUG_KEYSTORE_B64 = base64 cua %USERPROFILE%\.android\debug.keystore
      - name: Restore debug keystore
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_B64 }}" ]; then
            echo "::error::Thieu secret DEBUG_KEYSTORE_B64 - xem huong dan trong file workflow nay"
            exit 1
          fi
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chan lech version: tag phai trung versionName trong build.gradle.kts,
      # neu khong updater trong app se loop hoac khong thay ban moi.
      - name: Verify tag matches versionName
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME khac versionName $V trong app/build.gradle.kts"
            exit 1
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK theo chuan updater
        run: cp app/build/outputs/apk/release/app-release.apk "LichNoti_${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release + upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: LichNoti_${{ github.ref_name }}.apk
          generate_release_notes: true
